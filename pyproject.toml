[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-caldav"
version = "0.1.0"
description = "Model Context Protocol (MCP)와 CalDAV 서버를 연동하는 Python 기반 커넥터"
readme = "README.md"
authors = [
    {name = "pchuri", email = "pchuri@gmail.com"}
]
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "mcp>=0.1.0",
    "caldav>=1.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
"Homepage" = "https://github.com/pchuri/mcp-caldav-connector"
"Bug Reports" = "https://github.com/pchuri/mcp-caldav-connector/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88
